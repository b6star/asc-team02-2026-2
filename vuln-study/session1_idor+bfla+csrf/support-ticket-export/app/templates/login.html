{% extends "base.html" %}
{% block title %}고객 로그인 | 고객 지원 센터{% endblock %}
{% block content %}
<section class="card login-card">
  <p class="breadcrumbs">고객 지원 센터 <span>›</span> 고객 로그인</p>
  <p class="eyebrow">CUSTOMER ACCOUNT</p>
  <h1>고객 로그인</h1>
  <p class="muted">실습 계정: <code>customer11 / givemetheflag</code></p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" class="stack">
    <label>아이디<input name="username" value="customer11" required></label>
    <label>비밀번호<input name="password" type="password" value="givemetheflag" required></label>
    <button class="primary" type="submit">로그인</button>
  </form>
</section>
{% endblock %}
